name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GitHub Actions already exports CI=true; pin it explicitly because the shard
# tasks are `onlyIf { System.getenv("CI") != null }` (Local = Build, Tests = CI).
env:
  CI: "true"

jobs:
  # ── Unit tests (JUnit 5) ─────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — skip the post-job cache-cleanup Gradle build (it re-starts a
          # single-use daemon and reconfigures: ~3-40 s/job, on the critical path).
          cache-cleanup: never

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-unit
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── functionalTest shards (6 parallel machines) ─────────────────────────────
  # The 28 @Test functional classes are split in `.github/workflows/test.yml`
  # into an exhaustive, disjoint partition; guarded by
  # `bakery.ci.BakeryCucumberShardCoverageTest`.
  functional-shard:
    name: Functional · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "A"
            task: functionalTestShardA
          - name: "B"
            task: functionalTestShardB
          - name: "C"
            task: functionalTestShardC
          - name: "D"
            task: functionalTestShardD
          - name: "E"
            task: functionalTestShardE
          - name: "F"
            task: functionalTestShardF
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — keep writing this job's own Gradle User Home, but skip the
          # post-job cache-cleanup Gradle build (~3-40 s/job, re-starts a
          # single-use daemon + reconfigures). Disabling cleanup also stops the
          # local build cache (`caches/build-cache-1`) from being purged, so a
          # subsequent run of the *same* job restores warm compile outputs
          # (FROM-CACHE).
          cache-cleanup: never

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run functional shard
        run: ./gradlew ${{ matrix.task }}

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── BDD shards (8 parallel machines) ─────────────────────────────────────────
  # The 71 features are split into an exhaustive, disjoint partition; guarded by
  # `bakery.ci.BakeryCucumberShardCoverageTest`.
  bdd-shard:
    name: BDD · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "jbake-core-foundations"
            task: cucumberTestShardJbakeCoreFoundations
          - name: "jbake-core-components"
            task: cucumberTestShardJbakeCoreComponents
          - name: "jbake-core-pipelines"
            task: cucumberTestShardJbakeCorePipelines
          - name: "lens-tree"
            task: cucumberTestShardLensTree
          - name: "site-tree"
            task: cucumberTestShardSiteTree
          - name: "lang-switch-core"
            task: cucumberTestShardLangSwitchCore
          - name: "lang-switch-ecosystem"
            task: cucumberTestShardLangSwitchEcosystem
          - name: "i18n-mass-pipeline"
            task: cucumberTestShardI18nMassPipeline
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — skip the post-job cache-cleanup Gradle build; keep the local
          # build cache so the next run of this job restores FROM-CACHE compile.
          cache-cleanup: never

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }}

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── Node.js host tests (language switcher) ───────────────────────────────────
  node:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — skip the post-job cache-cleanup Gradle build.
          cache-cleanup: never

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run node tests
        run: ./gradlew nodeTest

  # ── E2E (Playwright) ─────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — skip the post-job cache-cleanup Gradle build.
          cache-cleanup: never

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache the Playwright Chromium download (~150 MB). Keyed by the catalog
      # (any dependency bump refreshes it) AND by the runner image (`ImageOS`,
      # e.g. ubuntu24 → ubuntu26): a browser built for one distro is not usable
      # on the next one, and `runner.os` stays `Linux` across the migration, so
      # an OS-only key restores a stale Chromium and `playwright install` skips
      # → "Failed to install browsers" (S-264, ubuntu-latest → 26.04).
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('bakery-plugin/gradle/libs.versions.toml') }}

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright

      - name: Run E2E tests
        run: ./gradlew e2eTest

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-e2e
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── Coverage merge (all binary reports) ──────────────────────────────────────
  # Every shard uploads its `build/kover/bin-reports/*.ic`; this job downloads all
  # of them into the same directory and runs the report + threshold check WITHOUT
  # re-running any test (the `-x` excludes every instrumented Test task; kover
  # still aggregates the binary reports already present on disk).
  coverage:
    name: Coverage (merged)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, functional-shard, bdd-shard, e2e]
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # S-259 — skip the post-job cache-cleanup Gradle build; keep the local
          # build cache so the next run restores FROM-CACHE compile.
          cache-cleanup: never

      - name: Download every coverage binary report
        uses: actions/download-artifact@v4
        with:
          pattern: kover-ic-*
          merge-multiple: true
          path: bakery-plugin/build/kover/bin-reports

      - name: List merged binary reports
        run: ls -la build/kover/bin-reports

      - name: Verify merged coverage threshold
        run: >
          ./gradlew koverXmlReport koverThresholdCheck
          -x test -x functionalTest -x cucumberTest -x e2eTest -x nodeTest
          -x functionalTestShardA -x functionalTestShardB -x functionalTestShardC
          -x functionalTestShardD -x functionalTestShardE -x functionalTestShardF
          -x cucumberTestShardJbakeCoreFoundations -x cucumberTestShardJbakeCoreComponents
          -x cucumberTestShardJbakeCorePipelines
          -x cucumberTestShardLensTree -x cucumberTestShardSiteTree
          -x cucumberTestShardLangSwitchCore -x cucumberTestShardLangSwitchEcosystem
          -x cucumberTestShardI18nMassPipeline

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-merged-report
          path: bakery-plugin/build/reports/kover/
          if-no-files-found: warn
