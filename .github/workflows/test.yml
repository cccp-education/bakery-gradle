name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GitHub Actions already exports CI=true; pin it explicitly because the shard
# tasks are `onlyIf { System.getenv("CI") != null }` (Local = Build, Tests = CI).
env:
  CI: "true"

jobs:
  # ── Unit tests (JUnit 5) ─────────────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-unit
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── functionalTest shards (4 parallel machines) ─────────────────────────────
  # The 28 @Test functional classes are split in `.github/workflows/test.yml`
  # into an exhaustive, disjoint partition; guarded by
  # `bakery.ci.BakeryCucumberShardCoverageTest`.
  functional-shard:
    name: Functional · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "A"
            task: functionalTestShardA
          - name: "B"
            task: functionalTestShardB
          - name: "C"
            task: functionalTestShardC
          - name: "D"
            task: functionalTestShardD
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run functional shard
        run: ./gradlew ${{ matrix.task }}

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── BDD shards (8 parallel machines) ─────────────────────────────────────────
  # The 71 features are split into an exhaustive, disjoint partition; guarded by
  # `bakery.ci.BakeryCucumberShardCoverageTest`.
  bdd-shard:
    name: BDD · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "jbake-core-foundations"
            task: cucumberTestShardJbakeCoreFoundations
          - name: "jbake-core-components"
            task: cucumberTestShardJbakeCoreComponents
          - name: "jbake-core-pipelines"
            task: cucumberTestShardJbakeCorePipelines
          - name: "lens-tree"
            task: cucumberTestShardLensTree
          - name: "site-tree"
            task: cucumberTestShardSiteTree
          - name: "lang-switch-core"
            task: cucumberTestShardLangSwitchCore
          - name: "lang-switch-ecosystem"
            task: cucumberTestShardLangSwitchEcosystem
          - name: "i18n-mass-pipeline"
            task: cucumberTestShardI18nMassPipeline
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run BDD shard
        run: ./gradlew ${{ matrix.task }}

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-${{ matrix.task }}
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── Node.js host tests (language switcher) ───────────────────────────────────
  node:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run node tests
        run: ./gradlew nodeTest

  # ── E2E (Playwright) ─────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright

      - name: Run E2E tests
        run: ./gradlew e2eTest

      - name: Upload coverage binary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-ic-e2e
          path: bakery-plugin/build/kover/bin-reports/*.ic
          if-no-files-found: error

  # ── Coverage merge (all binary reports) ──────────────────────────────────────
  # Every shard uploads its `build/kover/bin-reports/*.ic`; this job downloads all
  # of them into the same directory and runs the report + threshold check WITHOUT
  # re-running any test (the `-x` excludes every instrumented Test task; kover
  # still aggregates the binary reports already present on disk).
  coverage:
    name: Coverage (merged)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit, functional-shard, bdd-shard, e2e]
    defaults:
      run:
        working-directory: bakery-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download every coverage binary report
        uses: actions/download-artifact@v4
        with:
          pattern: kover-ic-*
          merge-multiple: true
          path: bakery-plugin/build/kover/bin-reports

      - name: List merged binary reports
        run: ls -la build/kover/bin-reports

      - name: Verify merged coverage threshold
        run: >
          ./gradlew koverXmlReport koverThresholdCheck
          -x test -x functionalTest -x cucumberTest -x e2eTest -x nodeTest
          -x functionalTestShardA -x functionalTestShardB -x functionalTestShardC -x functionalTestShardD
          -x cucumberTestShardJbakeCoreFoundations -x cucumberTestShardJbakeCoreComponents
          -x cucumberTestShardJbakeCorePipelines
          -x cucumberTestShardLensTree -x cucumberTestShardSiteTree
          -x cucumberTestShardLangSwitchCore -x cucumberTestShardLangSwitchEcosystem
          -x cucumberTestShardI18nMassPipeline

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-merged-report
          path: bakery-plugin/build/reports/kover/
          if-no-files-found: warn
