name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  publish-website:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Push website
        env:
          SITE_YML: ${{ secrets.SITE_YML }}
        run: |
          if [ -z "$SITE_YML" ]; then
            echo "::error::SITE_YML secret is not set — cannot deploy. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s\n' "$SITE_YML" > site.yml
          ./gradlew --no-daemon -s publishSite
