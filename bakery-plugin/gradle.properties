# GBL-014 — publication channel, two single sources of version (never a literal).
# The catalogue is served by JitPack in its *relabelled* projection: the tag
# `vX.Y.Z` is published as version `X.Y.Z` (`workspace-catalog:0.0.136` is 200,
# `workspace-catalog:v0.0.136` is 404), so the pin carries no `v` prefix.
# `workspaceCatalogVersion` is the served catalogue version on both channels
# (`com.github.cccp-education.workspace-bom:workspace-catalog` on jitpack,
# `education.cccp:workspace-catalog` on central).
# `workspaceBomVersion` is the Central BOM *platform* (the JitPack BOM POM is not
# a valid platform: no dependencyManagement, no module metadata), imported only
# on the `central` channel.
# BakeryPluginPublicationTest asserts the catalogue pin equals the workspace-bom
# version the published catalogue declares and that the platform stays central.
workspaceCatalogVersion=0.0.136
workspaceBomVersion=0.0.115
